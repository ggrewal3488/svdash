name: Deploy Master Web to Pages

on:
  push:
    branches: [ main ]
    paths: [ 'master/web/**' ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload master/web as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: master/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
